name: build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: aram-core branch, tag, or commit to integrate
        required: false
        default: 06e964b4ab78415e3234c43007b1661d3d7865ce
      frontend_ref:
        description: aram-frontend branch, tag, or commit to integrate
        required: false
        default: c64ba43b97875058f10eee9ae2a6d9d4d439b086
  release:
    types:
      - published

permissions:
  contents: read

env:
  ARAM_CORE_REF: 06e964b4ab78415e3234c43007b1661d3d7865ce
  ARAM_FRONTEND_REF: c64ba43b97875058f10eee9ae2a6d9d4d439b086

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows-amd64
            executable: aram.exe
            probe: aram-probe.exe
            archive: aram-windows-amd64.zip
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux-amd64
            executable: aram
            probe: aram-probe
            archive: aram-linux-amd64.tar.gz
          - name: macOS arm64
            runner: macos-latest
            platform: macos-arm64
            executable: aram
            probe: aram-probe
            archive: aram-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out product
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false

      - name: Check out core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ inputs.core_ref || env.ARAM_CORE_REF }}
          path: aram-core
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ inputs.frontend_ref || env.ARAM_FRONTEND_REF }}
          path: aram-frontend
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: aram-emu/go.mod
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config xvfb

      - name: Test
        if: runner.os != 'Linux'
        working-directory: aram-emu
        run: go test ./...

      - name: Test under Xvfb
        if: runner.os == 'Linux'
        working-directory: aram-emu
        run: xvfb-run -a go test ./...

      - name: Vet
        working-directory: aram-emu
        run: go vet ./...

      - name: Build product and probe
        working-directory: aram-emu
        shell: bash
        run: |
          mkdir -p build/package dist
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/${{ matrix.executable }}" ./cmd/aram
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/${{ matrix.probe }}" ./cmd/aram-probe
          cp README.md build/package/
          {
            echo "aram-emu=${GITHUB_SHA}"
            echo "aram-core=$(git -C ../aram-core rev-parse HEAD)"
            echo "aram-frontend=$(git -C ../aram-frontend rev-parse HEAD)"
          } > build/package/BUILD-INFO.txt

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: aram-emu
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'build/package/*' `
            -DestinationPath 'dist/${{ matrix.archive }}'

      - name: Package Unix build
        if: runner.os != 'Windows'
        working-directory: aram-emu
        shell: bash
        run: tar -C build/package -czf "dist/${{ matrix.archive }}" .

      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          name: aram-${{ matrix.platform }}
          path: aram-emu/dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-windows-amd64.zip
          test -f aram-linux-amd64.tar.gz
          test -f aram-macos-arm64.tar.gz
          sha256sum \
            aram-windows-amd64.zip \
            aram-linux-amd64.tar.gz \
            aram-macos-arm64.tar.gz \
            > SHA256SUMS.txt
      - name: Publish rolling Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          title="Nightly ${short_sha}"
          notes="Automated main-branch build from ${GITHUB_SHA}.

          Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git tag --force nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          else
            gh release create nightly \
              --verify-tag \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          fi
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload nightly "${assets[@]}" --clobber

  publish-stable:
    if: github.event_name == 'release' && github.event.release.tag_name != 'nightly'
    needs:
      - desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-windows-amd64.zip
          test -f aram-linux-amd64.tar.gz
          test -f aram-macos-arm64.tar.gz
          sha256sum \
            aram-windows-amd64.zip \
            aram-linux-amd64.tar.gz \
            aram-macos-arm64.tar.gz \
            > SHA256SUMS.txt
      - name: Attach archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
