name: build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: aram-core override (blank uses product-components.json)
        required: false
      frontend_ref:
        description: aram-frontend override (blank uses product-components.json)
        required: false
      authd_ref:
        description: aram-authd override (blank uses product-components.json)
        required: false
      ebiten_ref:
        description: ebiten fork override for the RG DS build (blank uses product-components.json)
        required: false
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-components:
    name: Resolve product components
    runs-on: ubuntu-latest
    outputs:
      core_sha: ${{ steps.revisions.outputs.core_sha }}
      frontend_sha: ${{ steps.revisions.outputs.frontend_sha }}
      authd_sha: ${{ steps.revisions.outputs.authd_sha }}
      ebiten_sha: ${{ steps.revisions.outputs.ebiten_sha }}
    steps:
      - name: Check out product manifest
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false

      - name: Select requested component refs
        id: requested
        working-directory: aram-emu
        shell: bash
        env:
          CORE_REF_OVERRIDE: ${{ inputs.core_ref }}
          FRONTEND_REF_OVERRIDE: ${{ inputs.frontend_ref }}
          AUTHD_REF_OVERRIDE: ${{ inputs.authd_ref }}
          EBITEN_REF_OVERRIDE: ${{ inputs.ebiten_ref }}
        run: |
          core_ref="${CORE_REF_OVERRIDE:-$(jq -r '.core' product-components.json)}"
          frontend_ref="${FRONTEND_REF_OVERRIDE:-$(jq -r '.frontend' product-components.json)}"
          authd_ref="${AUTHD_REF_OVERRIDE:-$(jq -r '.authd' product-components.json)}"
          ebiten_ref="${EBITEN_REF_OVERRIDE:-$(jq -r '.ebiten' product-components.json)}"
          test -n "${core_ref}"
          test "${core_ref}" != "null"
          test -n "${frontend_ref}"
          test "${frontend_ref}" != "null"
          test -n "${authd_ref}"
          test "${authd_ref}" != "null"
          test -n "${ebiten_ref}"
          test "${ebiten_ref}" != "null"
          echo "core_ref=${core_ref}" >> "${GITHUB_OUTPUT}"
          echo "frontend_ref=${frontend_ref}" >> "${GITHUB_OUTPUT}"
          echo "authd_ref=${authd_ref}" >> "${GITHUB_OUTPUT}"
          echo "ebiten_ref=${ebiten_ref}" >> "${GITHUB_OUTPUT}"

      - name: Check out core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ steps.requested.outputs.core_ref }}
          path: aram-core
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ steps.requested.outputs.frontend_ref }}
          path: aram-frontend
          persist-credentials: false

      - name: Check out authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ steps.requested.outputs.authd_ref }}
          path: aram-authd
          persist-credentials: false

      - name: Check out ebiten fork
        uses: actions/checkout@v6
        with:
          repository: mirusu400/ebiten
          ref: ${{ steps.requested.outputs.ebiten_ref }}
          path: ebiten
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact component revisions
        id: revisions
        shell: bash
        run: |
          echo "core_sha=$(git -C aram-core rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "frontend_sha=$(git -C aram-frontend rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "authd_sha=$(git -C aram-authd rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "ebiten_sha=$(git -C ebiten rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  desktop:
    name: ${{ matrix.name }}
    needs:
      - resolve-components
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows-amd64
            executable: aram.exe
            probe: aram-probe.exe
            archive: aram-windows-amd64.zip
          - name: Linux x64
            runner: ubuntu-latest
            platform: linux-amd64
            executable: aram
            probe: aram-probe
            archive: aram-linux-amd64.tar.gz
          - name: macOS arm64
            runner: macos-latest
            platform: macos-arm64
            executable: aram
            probe: aram-probe
            archive: aram-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out product
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false

      - name: Check out core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ needs.resolve-components.outputs.core_sha }}
          path: aram-core
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ needs.resolve-components.outputs.frontend_sha }}
          path: aram-frontend
          persist-credentials: false

      - name: Check out authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ needs.resolve-components.outputs.authd_sha }}
          path: aram-authd
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: aram-emu/go.mod
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum
            aram-authd/go.sum

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config xvfb

      - name: Test
        if: runner.os != 'Linux'
        working-directory: aram-emu
        run: go test ./...

      - name: Test under Xvfb
        if: runner.os == 'Linux'
        working-directory: aram-emu
        run: xvfb-run -a go test ./...

      - name: Vet
        working-directory: aram-emu
        run: go vet ./...

      - name: Build product and probe
        working-directory: aram-emu
        shell: bash
        env:
          CORE_SHA: ${{ needs.resolve-components.outputs.core_sha }}
          FRONTEND_SHA: ${{ needs.resolve-components.outputs.frontend_sha }}
        run: |
          mkdir -p build/icons build/package dist
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            go generate ./cmd/aram
            test -s cmd/aram/rsrc_windows_amd64.syso
          elif [[ "${RUNNER_OS}" == "macOS" ]]; then
            go run ./cmd/aram-iconpack \
              -source ../aram-frontend/frontend/assets/icon.png \
              -icns build/icons/aram.icns
          fi
          emu_short="${GITHUB_SHA::7}"
          core_short="${CORE_SHA::7}"
          frontend_short="${FRONTEND_SHA::7}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            build_version="${GITHUB_REF_NAME}"
          elif [[ ("${GITHUB_EVENT_NAME}" == "push" ||
                   "${GITHUB_EVENT_NAME}" == "workflow_dispatch") &&
                  "${GITHUB_REF}" == "refs/heads/main" ]]; then
            build_version="Nightly-${emu_short}-c${core_short}-f${frontend_short}"
          else
            build_version="Development-${emu_short}-c${core_short}-f${frontend_short}"
          fi
          go build -trimpath \
            -ldflags="-s -w -X=github.com/mirusu400/aram-frontend/frontend.BuildVersion=${build_version}" \
            -o "build/package/${{ matrix.executable }}" ./cmd/aram
          go build -trimpath -ldflags="-s -w" \
            -o "build/package/${{ matrix.probe }}" ./cmd/aram-probe
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            app="build/package/ARAM.app"
            mkdir -p "${app}/Contents/MacOS" "${app}/Contents/Resources"
            mv build/package/aram "${app}/Contents/MacOS/aram"
            cp packaging/macos/Info.plist "${app}/Contents/Info.plist"
            cp build/icons/aram.icns "${app}/Contents/Resources/aram.icns"
            cp packaging/macos/aram build/package/aram
            chmod +x build/package/aram
            plutil -lint "${app}/Contents/Info.plist"
            test -x "${app}/Contents/MacOS/aram"
            test -s "${app}/Contents/Resources/aram.icns"
            test -x build/package/aram
          fi
          cp README.md build/package/
          {
            echo "aram-emu=${GITHUB_SHA}"
            echo "aram-core=${{ needs.resolve-components.outputs.core_sha }}"
            echo "aram-frontend=${{ needs.resolve-components.outputs.frontend_sha }}"
            echo "aram-authd=${{ needs.resolve-components.outputs.authd_sha }}"
          } > build/package/BUILD-INFO.txt

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: aram-emu
        shell: pwsh
        run: |
          Compress-Archive `
            -Path 'build/package/*' `
            -DestinationPath 'dist/${{ matrix.archive }}'

      - name: Package Unix build
        if: runner.os != 'Windows'
        working-directory: aram-emu
        shell: bash
        run: tar -C build/package -czf "dist/${{ matrix.archive }}" .

      - name: Upload desktop build
        uses: actions/upload-artifact@v7
        with:
          name: aram-${{ matrix.platform }}
          path: aram-emu/dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android universal APK
    needs:
      - resolve-components
    runs-on: ubuntu-latest
    steps:
      - name: Check out product
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false

      - name: Check out core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ needs.resolve-components.outputs.core_sha }}
          path: aram-core
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ needs.resolve-components.outputs.frontend_sha }}
          path: aram-frontend
          persist-credentials: false

      - name: Check out authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ needs.resolve-components.outputs.authd_sha }}
          path: aram-authd
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: aram-emu/go.mod
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum
            aram-authd/go.sum

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.1"
          cache-provider: basic

      - name: Install 16 KB-compatible Android NDK
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${sdkmanager}"
          "${sdkmanager}" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" \
            >> "${GITHUB_ENV}"

      - name: Build integrated Android AAR
        working-directory: aram-emu
        shell: bash
        env:
          CORE_SHA: ${{ needs.resolve-components.outputs.core_sha }}
          FRONTEND_SHA: ${{ needs.resolve-components.outputs.frontend_sha }}
        run: |
          # The binder copies in the Java glue that calls the bound package's
          # own API, so a binder older than the Ebitengine this module builds
          # against will not compile. Take the version from go.mod so the two
          # can never drift apart again.
          ebiten_version="$(go list -m -f '{{.Version}}' \
            github.com/hajimehoshi/ebiten/v2)"
          go install \
            "github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@${ebiten_version}"
          mkdir -p android/app/libs android/app/src/main/assets
          emu_short="${GITHUB_SHA::7}"
          core_short="${CORE_SHA::7}"
          frontend_short="${FRONTEND_SHA::7}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            build_version="${GITHUB_REF_NAME}"
          elif [[ ("${GITHUB_EVENT_NAME}" == "push" ||
                   "${GITHUB_EVENT_NAME}" == "workflow_dispatch") &&
                  "${GITHUB_REF}" == "refs/heads/main" ]]; then
            build_version="Nightly-${emu_short}-c${core_short}-f${frontend_short}"
          else
            build_version="Development-${emu_short}-c${core_short}-f${frontend_short}"
          fi
          ebitenmobile bind \
            -target android/arm64,android/amd64 \
            -androidapi 23 \
            -trimpath \
            -ldflags="-s -w -X=github.com/mirusu400/aram-frontend/frontend.BuildVersion=${build_version}" \
            -javapkg io.github.mirusu400.aram \
            -o android/app/libs/aram.aar \
            ./mobile
          {
            echo "aram-emu=${GITHUB_SHA}"
            echo "aram-core=${{ needs.resolve-components.outputs.core_sha }}"
            echo "aram-frontend=${{ needs.resolve-components.outputs.frontend_sha }}"
            echo "aram-authd=${{ needs.resolve-components.outputs.authd_sha }}"
          } > android/app/src/main/assets/BUILD-INFO.txt
          # Reused by the Google Play AAB step, which rebinds a play-flavor aar
          # with the same version but with the self-updater switched off.
          echo "ARAM_BUILD_VERSION=${build_version}" >> "${GITHUB_ENV}"

      - name: Build and lint Android APK
        working-directory: aram-emu
        shell: bash
        env:
          ARAM_VERSION_CODE: ${{ github.run_number }}
          ARAM_VERSION_NAME: ${{ github.sha }}
        run: |
          # The sideload channels ship the github flavor; the play flavor is a
          # separate store artifact built below. Lint always runs against the
          # github debug variant (the known-good gate). A release event ships
          # the stable channel ("ARAM", base package, stable-signed); every
          # other event ships the rolling nightly ("ARAM Nightly", .nightly
          # package, nightly-signed).
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            gradle --no-daemon --stacktrace -p android \
              :app:lintGithubDebug :app:assembleGithubRelease
            {
              echo "ARAM_APK=android/app/build/outputs/apk/github/release/app-github-release.apk"
              echo "ARAM_APP_PKG=io.github.mirusu400.aram"
              echo "ARAM_APP_LABEL=ARAM"
              echo "ARAM_CERT_CN=CN=ARAM, O=ARAM, C=KR"
              echo "ARAM_CERT_SHA=98:98:4B:3B:FF:4E:1D:2A:13:09:AC:26:C3:6F:97:CC:5A:A2:49:90:87:E7:94:85:BE:85:8A:5A:1E:59:2F:29"
            } >> "${GITHUB_ENV}"
          else
            gradle --no-daemon --stacktrace -p android \
              :app:lintGithubDebug :app:assembleGithubDebug
            {
              echo "ARAM_APK=android/app/build/outputs/apk/github/debug/app-github-debug.apk"
              echo "ARAM_APP_PKG=io.github.mirusu400.aram.nightly"
              echo "ARAM_APP_LABEL=ARAM Nightly"
              echo "ARAM_CERT_CN=CN=ARAM Nightly, O=ARAM, C=KR"
              echo "ARAM_CERT_SHA=F6:03:45:3C:75:84:DF:C3:CA:E6:B1:FB:4C:75:67:71:D1:7D:56:12:7D:38:1B:09:B4:18:62:B1:3A:3F:6C:C8"
            } >> "${GITHUB_ENV}"
          fi

      - name: Verify Android package
        working-directory: aram-emu
        shell: bash
        run: |
          apk="${ARAM_APK}"
          test -f "${apk}"
          test "$(unzip -Z1 "${apk}" | grep -c '/libgojni.so$')" -eq 2
          for abi in arm64-v8a x86_64; do
            library="lib/${abi}/libgojni.so"
            unzip -l "${apk}" | grep -F "${library}"
            native_library="$(mktemp)"
            unzip -p "${apk}" "${library}" > "${native_library}"
            readelf -W -l "${native_library}" | python3 -c '
          import sys
          alignments = [
              int(line.split()[-1], 16)
              for line in sys.stdin
              if line.lstrip().startswith("LOAD")
          ]
          if not alignments or min(alignments) < 0x4000:
              raise SystemExit("native LOAD segments are not 16 KB-aligned")
          '
            rm -f "${native_library}"
          done
          unzip -p "${apk}" assets/BUILD-INFO.txt | grep -Fx \
            "aram-emu=${GITHUB_SHA}"
          aapt="$(find "${ANDROID_HOME}/build-tools" -name aapt -type f |
            sort -V | tail -n 1)"
          test -x "${aapt}"
          "${aapt}" dump badging "${apk}" > android/app/build/apk-badging.txt
          grep -F "package: name='${ARAM_APP_PKG}'" \
            android/app/build/apk-badging.txt
          grep -F "application-label:'${ARAM_APP_LABEL}'" \
            android/app/build/apk-badging.txt
          grep -F "launchable-activity: name='io.github.mirusu400.aram.app.MainActivity'" \
            android/app/build/apk-badging.txt
          grep -F "icon='res/mipmap-anydpi-v26/ic_aram.xml'" \
            android/app/build/apk-badging.txt
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            unzip -Z1 "${apk}" | grep -Fx \
              "res/mipmap-${density}-v4/ic_aram.png"
            unzip -Z1 "${apk}" | grep -Fx \
              "res/drawable-${density}-v4/ic_aram_foreground.png"
          done
          keytool -printcert -jarfile "${apk}" \
            > android/app/build/apk-signing.txt
          grep -F "Owner: ${ARAM_CERT_CN}" \
            android/app/build/apk-signing.txt
          grep -F \
            "SHA256: ${ARAM_CERT_SHA}" \
            android/app/build/apk-signing.txt
          mkdir -p dist
          cp "${apk}" dist/aram-android-universal.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: aram-android-universal
          path: aram-emu/dist/aram-android-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Google Play AAB
        if: github.event_name == 'release'
        working-directory: aram-emu
        shell: bash
        env:
          ARAM_VERSION_CODE: ${{ github.run_number }}
          ARAM_VERSION_NAME: ${{ github.sha }}
        run: |
          # The Play build strips the in-app self-updater. The play flavor drops
          # REQUEST_INSTALL_PACKAGES and the package-install provider, and the
          # bound aar is rebuilt with SelfUpdateDisabled so the frontend hides
          # its update check, badge, and download UI. Google Play delivers
          # updates instead. bundlePlayRelease emits an .aab for the store.
          ebiten_version="$(go list -m -f '{{.Version}}' \
            github.com/hajimehoshi/ebiten/v2)"
          go install \
            "github.com/hajimehoshi/ebiten/v2/cmd/ebitenmobile@${ebiten_version}"
          ebitenmobile bind \
            -target android/arm64,android/amd64 \
            -androidapi 23 \
            -trimpath \
            -ldflags="-s -w -X=github.com/mirusu400/aram-frontend/frontend.BuildVersion=${ARAM_BUILD_VERSION} -X=github.com/mirusu400/aram-frontend/frontend.SelfUpdateDisabled=1" \
            -javapkg io.github.mirusu400.aram \
            -o android/app/libs/aram-play.aar \
            ./mobile
          gradle --no-daemon --stacktrace -p android \
            :app:lintPlayDebug :app:bundlePlayRelease
          aab="android/app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -f "${aab}"
          mkdir -p dist
          cp "${aab}" dist/aram-google-play.aab

      - name: Upload Google Play AAB
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: aram-google-play
          path: aram-emu/dist/aram-google-play.aab
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web (WebAssembly)
    needs:
      - resolve-components
    runs-on: ubuntu-latest
    steps:
      - name: Check out product
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false

      - name: Check out core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ needs.resolve-components.outputs.core_sha }}
          path: aram-core
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ needs.resolve-components.outputs.frontend_sha }}
          path: aram-frontend
          persist-credentials: false

      - name: Check out authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ needs.resolve-components.outputs.authd_sha }}
          path: aram-authd
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: aram-emu/go.mod
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum
            aram-authd/go.sum

      - name: Vet WebAssembly command
        working-directory: aram-emu
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./cmd/aram-web

      - name: Build WebAssembly bundle
        working-directory: aram-emu
        shell: bash
        env:
          CORE_SHA: ${{ needs.resolve-components.outputs.core_sha }}
          FRONTEND_SHA: ${{ needs.resolve-components.outputs.frontend_sha }}
        run: |
          mkdir -p web dist
          emu_short="${GITHUB_SHA::7}"
          core_short="${CORE_SHA::7}"
          frontend_short="${FRONTEND_SHA::7}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            build_version="${GITHUB_REF_NAME}"
          elif [[ ("${GITHUB_EVENT_NAME}" == "push" ||
                   "${GITHUB_EVENT_NAME}" == "workflow_dispatch") &&
                  "${GITHUB_REF}" == "refs/heads/main" ]]; then
            build_version="Nightly-${emu_short}-c${core_short}-f${frontend_short}"
          else
            build_version="Development-${emu_short}-c${core_short}-f${frontend_short}"
          fi
          GOOS=js GOARCH=wasm go build -trimpath \
            -ldflags="-s -w -X=github.com/mirusu400/aram-frontend/frontend.BuildVersion=${build_version}" \
            -o web/aram.wasm ./cmd/aram-web
          test -s web/aram.wasm
          # wasm_exec.js ships with the Go toolchain: lib/wasm on Go >= 1.24,
          # misc/wasm on older toolchains.
          wasm_exec="$(go env GOROOT)/lib/wasm/wasm_exec.js"
          if [[ ! -f "${wasm_exec}" ]]; then
            wasm_exec="$(go env GOROOT)/misc/wasm/wasm_exec.js"
          fi
          test -f "${wasm_exec}"
          cp "${wasm_exec}" web/wasm_exec.js
          test -f web/index.html
          {
            echo "aram-emu=${GITHUB_SHA}"
            echo "aram-core=${{ needs.resolve-components.outputs.core_sha }}"
            echo "aram-frontend=${{ needs.resolve-components.outputs.frontend_sha }}"
            echo "aram-authd=${{ needs.resolve-components.outputs.authd_sha }}"
          } > web/BUILD-INFO.txt
          (cd web && zip -X "../dist/aram-web.zip" \
            aram.wasm wasm_exec.js index.html BUILD-INFO.txt)
          test -s dist/aram-web.zip

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: aram-web
          path: aram-emu/dist/aram-web.zip
          if-no-files-found: error
          retention-days: 14

  rgds:
    name: RG DS (ROCKNIX linux/arm64)
    needs:
      - resolve-components
    runs-on: ubuntu-latest
    steps:
      - name: Check out product
        uses: actions/checkout@v6
        with:
          path: aram-emu
          persist-credentials: false

      - name: Check out core
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-core
          ref: ${{ needs.resolve-components.outputs.core_sha }}
          path: aram-core
          persist-credentials: false

      - name: Check out frontend
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-frontend
          ref: ${{ needs.resolve-components.outputs.frontend_sha }}
          path: aram-frontend
          persist-credentials: false

      - name: Check out authd
        uses: actions/checkout@v6
        with:
          repository: mirusu400/aram-authd
          ref: ${{ needs.resolve-components.outputs.authd_sha }}
          path: aram-authd
          persist-credentials: false

      # The RG DS handheld has no window system, only a Mali GPU behind DRM/KMS.
      # Only this target swaps Ebitengine for the fork that adds the GBM/KMS
      # backend; every other platform keeps upstream Ebitengine from go.mod.
      - name: Check out ebiten GBM/KMS fork
        uses: actions/checkout@v6
        with:
          repository: mirusu400/ebiten
          ref: ${{ needs.resolve-components.outputs.ebiten_sha }}
          path: ebiten
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: aram-emu/go.mod
          cache-dependency-path: |
            aram-emu/go.sum
            aram-emu/go.work.sum
            aram-core/go.sum
            aram-frontend/go.sum
            aram-authd/go.sum

      - name: Point the workspace at the GBM/KMS fork
        working-directory: aram-emu
        shell: bash
        run: |
          # A filesystem replace needs no version and bypasses go.sum, matching
          # the local RG DS workflow. The sibling checkout is pinned by SHA.
          go work edit \
            -replace github.com/hajimehoshi/ebiten/v2=../ebiten
          resolved="$(go list -m -f '{{.Path}} {{.Replace.Dir}}' \
            github.com/hajimehoshi/ebiten/v2)"
          echo "ebiten resolves to: ${resolved}"
          case "${resolved}" in
            *"/ebiten") ;;
            *) echo "ebiten replace did not take effect" >&2; exit 1 ;;
          esac

      - name: Vet RG DS target
        working-directory: aram-emu
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go vet ./cmd/aram ./cmd/aram-probe

      - name: Build RG DS package
        working-directory: aram-emu
        shell: bash
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
          CORE_SHA: ${{ needs.resolve-components.outputs.core_sha }}
          FRONTEND_SHA: ${{ needs.resolve-components.outputs.frontend_sha }}
          EBITEN_SHA: ${{ needs.resolve-components.outputs.ebiten_sha }}
        run: |
          mkdir -p build/package dist
          emu_short="${GITHUB_SHA::7}"
          core_short="${CORE_SHA::7}"
          frontend_short="${FRONTEND_SHA::7}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            build_version="${GITHUB_REF_NAME}"
          elif [[ ("${GITHUB_EVENT_NAME}" == "push" ||
                   "${GITHUB_EVENT_NAME}" == "workflow_dispatch") &&
                  "${GITHUB_REF}" == "refs/heads/main" ]]; then
            build_version="Nightly-${emu_short}-c${core_short}-f${frontend_short}"
          else
            build_version="Development-${emu_short}-c${core_short}-f${frontend_short}"
          fi
          go build -trimpath \
            -ldflags="-s -w -X=github.com/mirusu400/aram-frontend/frontend.BuildVersion=${build_version}" \
            -o build/package/aram ./cmd/aram
          go build -trimpath -ldflags="-s -w" \
            -o build/package/aram-probe ./cmd/aram-probe
          # Fail loudly if the toolchain produced anything but an AArch64 ELF.
          readelf -h build/package/aram | grep -q 'Machine:.*AArch64'
          readelf -h build/package/aram-probe | grep -q 'Machine:.*AArch64'
          cp README.md build/package/
          {
            echo "aram-emu=${GITHUB_SHA}"
            echo "aram-core=${CORE_SHA}"
            echo "aram-frontend=${FRONTEND_SHA}"
            echo "aram-authd=${{ needs.resolve-components.outputs.authd_sha }}"
            echo "ebiten=${EBITEN_SHA}"
          } > build/package/BUILD-INFO.txt
          tar -C build/package -czf dist/aram-rocknix-arm64.tar.gz .
          test -s dist/aram-rocknix-arm64.tar.gz

      - name: Upload RG DS build
        uses: actions/upload-artifact@v7
        with:
          name: aram-rocknix-arm64
          path: aram-emu/dist/aram-rocknix-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - resolve-components
      - desktop
      - android
      - web
      - rgds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-windows-amd64.zip
          test -f aram-linux-amd64.tar.gz
          test -f aram-macos-arm64.tar.gz
          test -f aram-android-universal.apk
          test -f aram-web.zip
          test -f aram-rocknix-arm64.tar.gz
          sha256sum \
            aram-windows-amd64.zip \
            aram-linux-amd64.tar.gz \
            aram-macos-arm64.tar.gz \
            aram-android-universal.apk \
            aram-web.zip \
            aram-rocknix-arm64.tar.gz \
            > SHA256SUMS.txt
      - name: Publish rolling Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ needs.resolve-components.outputs.core_sha }}
          FRONTEND_SHA: ${{ needs.resolve-components.outputs.frontend_sha }}
          AUTHD_SHA: ${{ needs.resolve-components.outputs.authd_sha }}
        shell: bash
        run: |
          emu_short="${GITHUB_SHA::7}"
          core_short="${CORE_SHA::7}"
          frontend_short="${FRONTEND_SHA::7}"
          title="Nightly ${emu_short}-c${core_short}-f${frontend_short}"
          notes="Automated integrated ARAM build.

          aram-emu: ${GITHUB_SHA}
          aram-core: ${CORE_SHA}
          aram-frontend: ${FRONTEND_SHA}
          aram-authd: ${AUTHD_SHA}

          Source: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git tag --force nightly "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          else
            gh release create nightly \
              --verify-tag \
              --prerelease \
              --title "${title}" \
              --notes "${notes}"
          fi
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload nightly "${assets[@]}" --clobber
          if gh release view nightly --json assets --jq '.assets[].name' |
              grep -Fxq aram-android-arm64.apk; then
            gh release delete-asset nightly aram-android-arm64.apk --yes
          fi
      - name: Trigger aram-website redeploy
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set; skipping website redeploy."
            exit 0
          fi
          GH_TOKEN="${DISPATCH_TOKEN}" gh api \
            repos/mirusu400/aram-website/dispatches \
            -f event_type=nightly-updated
          echo "Signaled aram-website to redeploy with the latest nightly runtime."

  publish-stable:
    if: github.event_name == 'release' && github.event.release.tag_name != 'nightly'
    needs:
      - resolve-components
      - desktop
      - android
      - web
      - rgds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release archives
        shell: bash
        run: |
          cd release-assets
          test -f aram-windows-amd64.zip
          test -f aram-linux-amd64.tar.gz
          test -f aram-macos-arm64.tar.gz
          test -f aram-rocknix-arm64.tar.gz
          test -f aram-web.zip
          test -f aram-android-universal.apk
          sha256sum \
            aram-windows-amd64.zip \
            aram-linux-amd64.tar.gz \
            aram-macos-arm64.tar.gz \
            aram-rocknix-arm64.tar.gz \
            aram-web.zip \
            aram-android-universal.apk \
            > SHA256SUMS.txt
      - name: Attach archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f -print)
          test "${#assets[@]}" -gt 0
          gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
      - name: Publish the release article on aram.mir.sh
        env:
          DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set; skipping website release article."
            exit 0
          fi
          GH_TOKEN="${DISPATCH_TOKEN}" gh api \
            repos/mirusu400/aram-website/dispatches \
            -F event_type=release-published \
            -F "client_payload[tag]=${RELEASE_TAG}"
          echo "Signaled aram-website to publish the ${RELEASE_TAG} release article."
