name: sync product components

on:
  schedule:
    # GitHub's repository-scoped token cannot dispatch across repositories.
    # Poll the successful component Nightly tags at the shortest supported
    # schedule interval; repository_dispatch remains available for an
    # authenticated immediate notification.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - component-updated

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-product-components
  cancel-in-progress: false

jobs:
  sync:
    name: Sync successful component Nightlies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Update the product component lock
        id: components
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          core_sha="$(gh api repos/mirusu400/aram-core/commits/nightly --jq '.sha')"
          frontend_sha="$(gh api repos/mirusu400/aram-frontend/commits/nightly --jq '.sha')"
          current_core="$(jq -r '.core' product-components.json)"
          current_frontend="$(jq -r '.frontend' product-components.json)"

          echo "core_sha=${core_sha}" >> "${GITHUB_OUTPUT}"
          echo "frontend_sha=${frontend_sha}" >> "${GITHUB_OUTPUT}"
          if [[ "${core_sha}" == "${current_core}" &&
                "${frontend_sha}" == "${current_frontend}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          temporary="$(mktemp)"
          jq \
            --arg core "${core_sha}" \
            --arg frontend "${frontend_sha}" \
            '.core = $core | .frontend = $frontend' \
            product-components.json > "${temporary}"
          mv "${temporary}" product-components.json
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Commit the updated component lock
        if: steps.components.outputs.changed == 'true'
        env:
          CORE_SHA: ${{ steps.components.outputs.core_sha }}
          FRONTEND_SHA: ${{ steps.components.outputs.frontend_sha }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-components.json
          git commit -m "chore: update product components" \
            -m "aram-core: ${CORE_SHA}" \
            -m "aram-frontend: ${FRONTEND_SHA}"
          git push origin HEAD:main

      - name: Build the updated integrated product
        if: steps.components.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build.yml --ref main
