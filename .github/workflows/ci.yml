name: repository-policy

on:
  push:
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require ecosystem documents
        run: |
          test -f README.md
          test -f CODEX.md
          test -f docs/repositories.md
          test -f docs/architecture.md
          test -f docs/integration.md
          test -f docs/platforms.md
          test -f docs/roadmap.md
          test -f docs/frontend.md
          test -f docs/compatibility.md
      - name: Prevent implementation duplication
        run: |
          if find cmd internal -type f -print 2>/dev/null | grep .; then
            echo "Core/frontend implementation belongs in sibling repositories."
            exit 1
          fi
      - name: Reject proprietary inputs
        run: |
          if git ls-files | grep -E '\.(bin|dat|wbin|wbt|fnt|rom|img|mbn|i64|idb|apk|aar)$'; then
            echo "Proprietary or generated binary input is tracked."
            exit 1
          fi
