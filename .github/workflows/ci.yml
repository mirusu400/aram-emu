name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Install Linux frontend dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config xvfb
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a go test ./...
      - name: Vet
        run: go vet ./...
      - name: Reject proprietary inputs
        shell: bash
        run: |
          if git ls-files | grep -E '\.(bin|dat|wbin|wbt|fnt|rom|img|mbn|i64|idb)$'; then
            echo "Proprietary or reverse-engineering input is tracked."
            exit 1
          fi
