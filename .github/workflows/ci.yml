name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require ecosystem documents
        run: |
          test -f README.md
          test -f CODEX.md
          test -f docs/repositories.md
          test -f docs/architecture.md
          test -f docs/integration.md
          test -f docs/platforms.md
          test -f docs/roadmap.md
          test -f docs/frontend.md
          test -f docs/compatibility.md
          test -f cmd/aram-probe/main.go
      - name: Require integration ownership
        run: |
          test -f go.mod
          test -f cmd/aram/main.go
          test -f integration/backend.go
          if find internal/core internal/frontend -type f -print 2>/dev/null | grep .; then
            echo "Core/frontend implementation must stay in sibling repositories."
            exit 1
          fi
      - name: Reject proprietary inputs
        run: |
          if git ls-files | grep -E '\.(bin|dat|wbin|wbt|fnt|rom|img|mbn|i64|idb|apk|aar|jar|jad|zip|mmf|smaf|wav|mid|midi)$'; then
            echo "Proprietary or generated binary input is tracked."
            exit 1
          fi
