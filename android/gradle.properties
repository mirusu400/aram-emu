org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true
# The release build's optimize<Variant>Resources task (aapt2 optimize) collapses
# every resource file to a short generated name, independent of the legacy
# minifyEnabled/shrinkResources flags (both are off here) - confirmed via CI logs:
# task :app:optimizeGithubReleaseResources ran and turned
# "res/mipmap-anydpi-v26/ic_aram.xml" into "res/Xl.xml". That broke package
# verification, which checks the app icon and other resources by their literal
# source path. Keep readable resource paths in the shipped APK.
android.enableResourceOptimizations=false
