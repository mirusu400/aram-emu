org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=false
android.nonTransitiveRClass=true
# AGP 8.12+ has R8 optimize (and rename) resource file paths for a release
# build automatically, independent of the legacy minifyEnabled/shrinkResources
# flags (both are off here). That broke CI's package verification, which
# checks for the app icon and other resources by their literal source path
# ("res/mipmap-anydpi-v26/ic_aram.xml" became "res/Xl.xml"). Keep readable
# resource paths in the shipped APK.
android.r8.integratedResourceShrinking=false
