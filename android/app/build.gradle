plugins {
    id "com.android.application"
}

def aramVersionCode = (System.getenv("ARAM_VERSION_CODE") ?: "1").toInteger()
def aramVersionName = System.getenv("ARAM_VERSION_NAME") ?: "dev"
def aramAbis = (System.getenv("ARAM_ANDROID_ABIS") ?: "arm64-v8a,x86_64").split(",")
def aramEmuRoot = rootProject.projectDir.parentFile
def configuredAramIcon = System.getenv("ARAM_ICON_SOURCE")
def aramIconSource = configuredAramIcon
    ? rootProject.file(configuredAramIcon)
    : new File(aramEmuRoot.parentFile, "aram-frontend/frontend/assets/icon.png")
def aramGeneratedIconRes = layout.buildDirectory.dir("generated/aram-icons/res")

android {
    namespace "io.github.mirusu400.aram.app"
    compileSdk 36

    signingConfigs {
        nightly {
            storeFile file("../nightly.keystore")
            storePassword "aram-nightly"
            keyAlias "aram-nightly"
            keyPassword "aram-nightly"
        }
        stable {
            storeFile file("../stable.keystore")
            storePassword "aram-stable"
            keyAlias "aram-stable"
            keyPassword "aram-stable"
        }
        // Google Play upload key. Never hardcode this password - the keystore
        // itself and its password are both gitignored (../play.keystore,
        // play-signing.local.ps1). CI supplies them via secrets/env vars.
        play {
            storeFile file("../play.keystore")
            storePassword System.getenv("ARAM_PLAY_KEYSTORE_PASSWORD") ?: ""
            keyAlias "aram-play"
            keyPassword System.getenv("ARAM_PLAY_KEY_PASSWORD") ?: ""
        }
    }

    defaultConfig {
        applicationId "io.github.mirusu400.aram"
        minSdk 23
        targetSdk 36
        versionCode aramVersionCode
        versionName aramVersionName

        ndk {
            aramAbis.each { abiFilters it }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".nightly"
            versionNameSuffix "-nightly"
            signingConfig signingConfigs.nightly
            resValue "string", "app_name", "ARAM Nightly"
        }
        release {
            minifyEnabled false
            // No signingConfig here - each flavor below sets its own release
            // signing key. (buildType-level signingConfig would win over the
            // flavor's for every flavor, which is not what we want here.)
            resValue "string", "app_name", "ARAM"
        }
    }

    flavorDimensions "dist"

    productFlavors {
        // Sideloaded builds published on GitHub. They keep the in-app
        // self-updater: REQUEST_INSTALL_PACKAGES and UpdateProvider live in the
        // github source set, and installPackage opens the system installer.
        github {
            dimension "dist"
            signingConfig signingConfigs.stable
        }
        // Google Play build. No self-updater - Play delivers updates - so the
        // package-install permission and the provider are absent and
        // installPackage refuses. The bound aar is built with SelfUpdateDisabled
        // so the frontend hides its update UI as well.
        play {
            dimension "dist"
            signingConfig signingConfigs.play
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir aramGeneratedIconRes.get().asFile
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

def generateAramIcons = tasks.register("generateAramIcons", Exec) {
    workingDir aramEmuRoot
    commandLine(
        "go", "run", "./cmd/aram-iconpack",
        "-source", aramIconSource.absolutePath,
        "-android-res", aramGeneratedIconRes.get().asFile.absolutePath
    )
    inputs.file aramIconSource
    inputs.files fileTree(new File(aramEmuRoot, "cmd/aram-iconpack")) {
        include "**/*.go"
    }
    inputs.files fileTree(new File(aramEmuRoot, "internal/appicon")) {
        include "**/*.go"
    }
    outputs.dir aramGeneratedIconRes
}

tasks.named("preBuild").configure {
    dependsOn generateAramIcons
}

// The Play flavor binds an aar built with SelfUpdateDisabled, which CI writes
// to libs/aram-play.aar. A local build without that file falls back to the
// ordinary aar so the Play variant still assembles; only the native install
// path is stripped there, which is what Play policy requires.
def playAar = file("libs/aram-play.aar")
def playAarFile = playAar.exists() ? playAar : file("libs/aram.aar")

dependencies {
    githubImplementation files("libs/aram.aar")
    playImplementation files(playAarFile)
}
